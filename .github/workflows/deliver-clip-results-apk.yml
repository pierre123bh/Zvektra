name: Publish verified Clip Results Fix APK
on:
  push:
    branches: [delivery/clip-results-910167f]
    paths: [.github/workflows/deliver-clip-results-apk.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: 910167ff372eec9e2fb67e1aae040c067e024ac4
      BUILD_RUN: '44162975963'
      SMOKE_RUN: '44162975989'
      RELEASE_TAG: clip-results-910167f
    steps:
      - name: Verify Android checks and publish the APK
        run: |
          set -euo pipefail
          for run in "$BUILD_RUN" "$SMOKE_RUN"; do
            gh api "repos/$GH_REPO/actions/runs/$run" \
              | jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha'
            gh run watch "$run" --exit-status --interval 15
          done
          gh run download "$BUILD_RUN" --name zvektra-android-arm64 --dir dist
          cd dist
          sha256sum --check Zvektra-ARM64.apk.sha256
          gh release create "$RELEASE_TAG" Zvektra-ARM64.apk \
            --target "$BUILD_SHA" --prerelease --latest=false \
            --title "Zvektra Android — Clip Results Fix" \
            --notes "ARM64 Android APK from a verified build. Improves clip saving and shows clip actions in Results."
