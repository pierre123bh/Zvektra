name: Publish verified Interactive Voice APK
on:
  push:
    branches: [delivery/interactive-voice-apk]
    paths: [.github/workflows/deliver-interactive-voice-apk.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: 021bf7a587d441ae887e73ad5b37405be8e622f6
      BUILD_RUN: '43981396647'
      SMOKE_RUN: '43981396634'
      RELEASE_TAG: interactive-voice-021bf7a
    steps:
      - name: Verify Android checks and publish the APK
        run: |
          set -euo pipefail
          for run in "$BUILD_RUN" "$SMOKE_RUN"; do
            gh api "repos/$GH_REPO/actions/runs/$run" \
              | jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha'
            gh run watch "$run" --exit-status --interval 15
          done
          gh run download "$BUILD_RUN" --name zvektra-android-arm64 --dir dist
          cd dist
          sha256sum --check Zvektra-ARM64.apk.sha256
          gh release create "$RELEASE_TAG" Zvektra-ARM64.apk \
            --target "$BUILD_SHA" --prerelease --latest=false \
            --title "Zvektra Android — Interactive Voice" \
            --notes "ARM64 Android APK from a verified build. Includes Lebanese Arabic and English voice prompts, live and playback commands, and spoken feedback."
