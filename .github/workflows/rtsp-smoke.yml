name: Android streaming and playback detection smoke test
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, "voice/offline-whisper"]
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'test/device_form_test.dart'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/rtsp-smoke.yml'
permissions:
  contents: read
jobs:
  rtsp:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install video fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Start authenticated RTSP fixture
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/ultralytics/ultralytics/ef512bfc250a91fa75632efd1f3b7cc87a0cac3e/ultralytics/assets/zidane.jpg -o /tmp/people.jpg
          curl -fsSL --retry 3 https://raw.githubusercontent.com/ankandrew/fast-alpr/c5a94706f175590b2bc09aa86f46182d4c267fae/assets/test_image.png -o /tmp/plates.png
          ffmpeg -hide_banner -loglevel error -filter_complex_threads 1 \
            -loop 1 -framerate 10 -t 4 -i /tmp/people.jpg \
            -loop 1 -framerate 10 -t 4 -i /tmp/plates.png \
            -filter_complex '[0:v]scale=480:360:force_original_aspect_ratio=decrease,pad=480:360:(ow-iw)/2:(oh-ih)/2,setsar=1[people];[1:v]scale=480:360:force_original_aspect_ratio=decrease,pad=480:360:(ow-iw)/2:(oh-ih)/2,setsar=1[plates];[people][plates]concat=n=2:v=1:a=0' \
            -an -c:v libx264 -preset ultrafast -tune zerolatency -g 10 -pix_fmt yuv420p /tmp/playback.mp4
          cat > /tmp/mediamtx.yml <<'EOF'
          logLevel: warn
          rtspTransports: [tcp]
          authInternalUsers:
            - user: any
              ips: ['127.0.0.1']
              permissions:
                - action: publish
            - user: viewer
              pass: fixture-pass
              permissions:
                - action: read
          paths:
            all_others:
          EOF
          docker run --rm -d --name zvektra-rtsp --network host             -v /tmp/mediamtx.yml:/mediamtx.yml:ro bluenviron/mediamtx:1.12.3
          for attempt in {1..30}; do
            if nc -z 127.0.0.1 8554; then break; fi
            sleep 1
          done
          nc -z 127.0.0.1 8554
          ffmpeg -nostdin -hide_banner -loglevel error -re \
            -f lavfi -i testsrc2=size=320x240:rate=10 -an -c:v libx264 \
            -preset ultrafast -tune zerolatency -g 10 -pix_fmt yuv420p \
            -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/cam/realmonitor >/tmp/realmonitor.log 2>&1 &
          ffmpeg -nostdin -hide_banner -loglevel error -re \
            -stream_loop -1 -i /tmp/playback.mp4 -an -c:v copy \
            -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/cam/playback >/tmp/playback.log 2>&1 &
          sleep 2
          for path in realmonitor playback; do
            timeout 12 ffprobe -v error -rtsp_transport tcp               "rtsp://viewer:fixture-pass@127.0.0.1:8554/cam/$path"
          done
      - name: Start Dahua Port 2 fixture
        run: |
          ffmpeg -hide_banner -loglevel error -stream_loop 14 -i /tmp/playback.mp4 \
            -c:v copy -an -f h264 /tmp/download.h264
          python3 integration_test/make_dav_fixture.py /tmp/download.h264 /tmp/download.dav
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 /tmp/download.dav | grep -Fx h264
          python3 integration_test/dahua_download_fixture.py /tmp/download.dav &
          for attempt in {1..15}; do
            if nc -z 127.0.0.1 8085; then break; fi
            sleep 1
          done
          nc -z 127.0.0.1 8085
      - name: Build release-mode fixture app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64 \
            --target integration_test/dahua_stream_test.dart \
            --dart-define=ZVEKTRA_RTSP_HOST=127.0.0.1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash integration_test/run_release_rtsp.sh
