name: Publish verified Recording Analysis APK
on:
  push:
    branches: [delivery/recording-analysis-df9ca2e]
    paths: [.github/workflows/deliver-recording-analysis-apk.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: df9ca2e19440d685057106cd2d51ec6c2d596715
      BUILD_RUN: '44108429801'
      SMOKE_RUN: '44108429834'
      RELEASE_TAG: recording-analysis-df9ca2e
    steps:
      - name: Verify Android checks and publish the APK
        run: |
          set -euo pipefail
          for run in "$BUILD_RUN" "$SMOKE_RUN"; do
            gh api "repos/$GH_REPO/actions/runs/$run" \
              | jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha'
            gh run watch "$run" --exit-status --interval 15
          done
          gh run download "$BUILD_RUN" --name zvektra-android-arm64 --dir dist
          cd dist
          sha256sum --check Zvektra-ARM64.apk.sha256
          gh release create "$RELEASE_TAG" Zvektra-ARM64.apk \
            --target "$BUILD_SHA" --prerelease --latest=false \
            --title "Zvektra Android — Recording Analysis" \
            --notes "ARM64 Android APK from a verified build. Groups recording detections into a timeline with snapshots and event playback."
