name: Build Zvektra Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, "voice/offline-whisper"]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build ARM64 release-mode test APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Verify size, architecture and signature
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Zvektra-ARM64.apk
          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('dist/Zvektra-ARM64.apk')
          size = apk.stat().st_size
          print(f'APK size: {size:,} bytes', flush=True)
          assert 0 < size < 100_000_000, 'APK must be under 100 MB'
          with ZipFile(apk) as archive:
              assert archive.testzip() is None, 'Corrupt APK'
              native = {name.split('/')[1] for name in archive.namelist()
                        if name.startswith('lib/') and name.endswith('.so')}
              assert native == {'arm64-v8a'}, native
              assert 'lib/arm64-v8a/libvlc.so' in archive.namelist()
              assert 'lib/arm64-v8a/libapp.so' in archive.namelist()
              pattern = rb'dev\.flutter\.pigeon\.[A-Za-z0-9_.]*VlcPlayerApi\.initialize'
              dart = set(re.findall(pattern, archive.read('lib/arm64-v8a/libapp.so')))
              android = {match for name in archive.namelist() if name.endswith('.dex')
                         for match in re.findall(pattern, archive.read(name))}
              print(f'VLC initialization channel: {dart}')
              assert len(dart) == 1 and dart == android, (dart, android)
              dex = b''.join(archive.read(name) for name in archive.namelist()
                             if name.endswith('.dex'))
              jni = archive.read('lib/arm64-v8a/libvlcjni.so')
              class_names = set(re.findall(
                  rb'org/videolan/libvlc/[A-Za-z0-9_$]+(?:/[A-Za-z0-9_$]+)*', jni))
              missing = sorted(name for name in class_names
                               if b'L' + name + b';' not in dex)
              assert class_names and not missing, missing
              assert b'dispatchEventFromNative' in dex, 'Missing LibVLC JNI callback'
          PY
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose dist/Zvektra-ARM64.apk
          cd dist
          sha256sum Zvektra-ARM64.apk > Zvektra-ARM64.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: zvektra-android-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 90
