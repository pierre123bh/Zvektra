name: Publish verified Background Agent Port 2 APK
on:
  push:
    branches: [delivery/background-agent-port-2-535cee6]
    paths: [.github/workflows/deliver-background-agent-apk.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: 535cee62229d03257fe202adc392db1fdae97f41
      BUILD_RUN: '44274372293'
      SMOKE_RUN: '44274372297'
      RELEASE_TAG: background-agent-port-2-535cee6
    steps:
      - name: Verify Android checks and publish the APK
        run: |
          set -euo pipefail
          for run in "$BUILD_RUN" "$SMOKE_RUN"; do
            gh api "repos/$GH_REPO/actions/runs/$run" \
              | jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha'
            gh run watch "$run" --exit-status --interval 15
          done
          gh run download "$BUILD_RUN" --name zvektra-android-arm64 --dir dist
          cd dist
          sha256sum --check Zvektra-ARM64.apk.sha256
          gh release create "$RELEASE_TAG" Zvektra-ARM64.apk \
            --target "$BUILD_SHA" --prerelease --latest=false \
            --title "Zvektra Android — Background Agent" \
            --notes "ARM64 Android APK from a verified build. Adds optional Dahua recording downloads through Zvektra Port 2."
