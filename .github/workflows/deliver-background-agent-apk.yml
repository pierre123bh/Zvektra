name: Publish verified Background Agent APK
on:
  push:
    branches: [delivery/background-agent-15bea17]
    paths: [.github/workflows/deliver-background-agent-apk.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: 15bea17a15fca68c528d3e6675e2ec837eec31ec
      BUILD_RUN: '44238527427'
      SMOKE_RUN: '44238527148'
      RELEASE_TAG: background-agent-15bea17
    steps:
      - name: Verify Android checks and publish the APK
        run: |
          set -euo pipefail
          for run in "$BUILD_RUN" "$SMOKE_RUN"; do
            gh api "repos/$GH_REPO/actions/runs/$run" \
              | jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha'
            gh run watch "$run" --exit-status --interval 15
          done
          gh run download "$BUILD_RUN" --name zvektra-android-arm64 --dir dist
          cd dist
          sha256sum --check Zvektra-ARM64.apk.sha256
          gh release create "$RELEASE_TAG" Zvektra-ARM64.apk \
            --target "$BUILD_SHA" --prerelease --latest=false \
            --title "Zvektra Android — Background Agent" \
            --notes "ARM64 Android APK from a verified build. Adds Background Agent for automatic recording analysis and MP4 clip saving."
