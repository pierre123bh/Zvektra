name: Publish verified Background Agent Capture APK
on:
  push:
    branches: [delivery/background-agent-capture-start]
permissions:
  actions: read
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
  smoke:
    uses: ./.github/workflows/rtsp-smoke.yml
  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: background-agent-capture-start-${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zvektra-android-arm64
      - name: Verify checksum and publish the APK
        run: |
          sha256sum --check Zvektra-ARM64.apk.sha256
          gh release create "$RELEASE_TAG" Zvektra-ARM64.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Zvektra Android — Background Agent Capture" \
            --notes "Verified ARM64 build with Background Agent Port 1 startup tolerance and capture diagnostics."
