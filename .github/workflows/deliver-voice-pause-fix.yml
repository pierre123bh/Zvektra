name: Publish verified Voice Pause Fix APK
on:
  push:
    branches: [delivery/voice-pause-fix]
    paths: [.github/workflows/deliver-voice-pause-fix.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: fb08234be23c765fc36bdbf85fdf6f70173ad8df
      BUILD_RUN: '43987125762'
      SMOKE_RUN: '43987125792'
      RELEASE_TAG: voice-pause-fix-fb08234
    steps:
      - name: Verify Android checks and publish the APK
        run: |
          set -euo pipefail
          for run in "$BUILD_RUN" "$SMOKE_RUN"; do
            gh api "repos/$GH_REPO/actions/runs/$run" \
              | jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha'
            gh run watch "$run" --exit-status --interval 15
          done
          gh run download "$BUILD_RUN" --name zvektra-android-arm64 --dir dist
          cd dist
          sha256sum --check Zvektra-ARM64.apk.sha256
          gh release create "$RELEASE_TAG" Zvektra-ARM64.apk \
            --target "$BUILD_SHA" --prerelease --latest=false \
            --title "Zvektra Android — Voice Pause Fix" \
            --notes "ARM64 Android APK from a verified build. Allows longer voice commands and requires explicit live intent."
